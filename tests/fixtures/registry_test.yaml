- name: ltx-2.3-local
  template: workflows/ltx-2.3-i2v.json
  available: true
  duration_range: [3, 8]
  fps: 25
  resolutions: {480p: 480, 540p: 544, 720p: 736}
  dims_multiple: 32
  aspects: ["9:16", "16:9", "1:1"]
  timeout_s: 1800
  inject:
    image:  [{node: "269", field: "image"}]
    prompt: [{node: "320.319", field: "value"}]
