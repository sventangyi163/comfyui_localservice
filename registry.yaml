- name: ltx-2.3-local
  template: workflows/ltx-2.3-i2v.json
  available: true
  duration_range: [3, 8]
  fps: 25
  resolutions: {480p: 480, 540p: 544, 720p: 736}  # 短边目标像素（已按 dims_multiple=32 对齐；720p 实际 736）
  dims_multiple: 32
  aspects: ["9:16", "16:9", "1:1"]
  timeout_s: 1800
  inject:
    image:     [{node: "269", field: "image"}]
    prompt:    [{node: "320.319", field: "text"}]
    # 两段式模板：320.312(宽)/320.299(高) 是唯一尺寸源 → a/2(320.292/294) → 320.295 半分辨率一段
    # → LTXVLatentUpsampler ×2 → 全分辨率二段出片。宽高必须注入原语 320.312/320.299
    # （同时给 320.290 图像重排字段），320.295 保持 a/2 链接；否则两段尺寸不一致或输出 2× 目标。
    width:     [{node: "320.312", field: "value"}, {node: "320.290", field: "resize_type.width"}]
    height:    [{node: "320.299", field: "value"}, {node: "320.290", field: "resize_type.height"}]
    length:    [{node: "320.295", field: "length"}, {node: "320.305", field: "length"}]
    fps:       [{node: "320.305", field: "frame_rate"}, {node: "320.310", field: "fps"}]
    short_side: []   # 320.299 已由 height 直接注入（它实为“resize 高度”原语，非短边语义）
    seconds:   [{node: "320.301", field: "value"}]

- name: minimax-h3-local
  template: workflows/minimax-h3-i2v.json
  # 本机缺 minimax_h3_fl2va_pruned_int8_convrot.safetensors（现有 qwen3vl nvfp4 为另一发行版）；补齐文件并桌面版跑通后再启用
  available: false
  duration_range: [3, 8]
  fps: 25
  resolutions: {480p: 480, 540p: 544, 720p: 736}  # 短边目标像素（已按 dims_multiple=32 对齐；720p 实际 736）
  dims_multiple: 32
  aspects: ["9:16", "16:9", "1:1"]
  timeout_s: 1800
  inject:
    image:  [{node: "114", field: "image"}]
    # 转换后模板没有独立 PrimitiveStringMultiline，提示词直挂在 105.104(MiniMaxH3ImageToVideo).prompt
    prompt: [{node: "105.104", field: "prompt"}]
